<link rel="stylesheet" href="eliminacion.css">
<div class="elimination-section">
    <h3>Características de la Eliminación</h3>

    <table class="elimination-table">
        <tbody>
            <tr>
                <td>
                    <label>Orina:</label>
                    <select id="elim-orina">
                        <option value="">Seleccione</option>
                        <option>Normal</option>
                        <option>Oliguria</option>
                        <option>Poliuria</option>
                        <option>Anuria</option>
                        <option>Incontinencia</option>
                        <option>Sonda vesical</option>
                    </select>
                </td>

                <td>
                    <label>Vómitos:</label>
                    <select id="elim-vomitos">
                        <option value="">Seleccione</option>
                        <option>No presenta</option>
                        <option>Ocasionales</option>
                        <option>Frecuentes</option>
                        <option>Alimentarios</option>
                        <option>Biliosos</option>
                        <option>Hemáticos</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Deposiciones:</label>
                    <select id="elim-deposiciones">
                        <option value="">Seleccione</option>
                        <option>Normales</option>
                        <option>Constipación</option>
                        <option>Diarrea</option>
                        <option>Incontinencia fecal</option>
                        <option>Ausentes</option>
                        <option>Ostomía</option>
                    </select>
                </td>

                <td>
                    <label>Otros</label>
                        <input type="text" id="otros" name="otros">
                </td>
            </tr>
        </tbody>
    </table>
</div>
