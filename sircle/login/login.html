<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIRCLE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <h1>SIRCLE</h1>
                </div>
                <p>Sistema Integrado de Registro Clínico Electrónico</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="username" placeholder="Ingrese su usuario" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                        <button type="button" class="toggle-password" id="toggle-pwd">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Recordarme
                    </label>
                    <a href="#" id="forgot-link"><i class="fas fa-question-circle"></i> ¿Olvidó su contraseña?</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>

                <div id="message-area" class="message-area"></div>
            </form>

            <div class="login-footer">
                <p>© 2026 SIRCLE - Todos los derechos reservados</p>
                <p class="version">v1.0</p>
            </div>
        </div>
    </div>

    <!-- Modal recuperar contraseña (opcional, igual que antes) -->
    <div id="forgot-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> Recuperar Contraseña</h3>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Ingrese su correo electrónico para recibir instrucciones:</p>
                <div class="form-group">
                    <label for="reset-email">Correo electrónico</label>
                    <input type="email" id="reset-email" placeholder="ejemplo@hospital.cl">
                </div>
                <div class="modal-buttons">
                    <button class="btn-secondary" id="cancel-reset">Cancelar</button>
                    <button class="btn-primary" id="send-reset">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
